version: '1'
name: Install Dev Tools on Remote Host
description: |
  Checks whether NVM, Node.js, Yarn, Git, and Docker are already installed on a
  Debian/Ubuntu remote host, installs only the missing ones, and reports all tool
  versions (including Python) in a final summary.
tags:
  - devops
  - setup
  - remote-host
triggers:
  - type: manual

steps:
  # ── Step 1: Check which tools are already installed ───────────────────────
  - name: check_tools
    type: remoteHost.runCommand
    connector-id: ihor-vm
    with:
      code: |
        # Returns JSON null for missing tools, quoted version string for present ones.
        # Pure bash — intentionally avoids node/npm which may not exist yet.
        _v() { [ -n "$1" ] && printf '"%s"' "$1" || printf 'null'; }
        NVM=$(bash -c 'source "$HOME/.nvm/nvm.sh" 2>/dev/null && nvm --version' 2>/dev/null || true)
        GIT=$(git --version 2>/dev/null || true)
        NODE=$(node --version 2>/dev/null || true)
        NPM=$(npm --version 2>/dev/null || true)
        YARN=$(bash -c 'source "$HOME/.nvm/nvm.sh" 2>/dev/null; yarn --version' 2>/dev/null || true)
        DOCKER=$(docker --version 2>/dev/null || true)
        PYTHON=$(python3 --version 2>/dev/null || true)
        SCRIPT_OUTPUT=$(printf '{"nvm":%s,"git":%s,"node":%s,"npm":%s,"yarn":%s,"docker":%s,"python":%s}' \
          "$(_v "$NVM")" "$(_v "$GIT")" "$(_v "$NODE")" \
          "$(_v "$NPM")" "$(_v "$YARN")" "$(_v "$DOCKER")" "$(_v "$PYTHON")")

  # ── Step 2: Install NVM (skipped if already present) ──────────────────────
  - name: install_nvm
    type: remoteHost.runCommand
    connector-id: ihor-vm
    if: "${{ steps.check_tools.output.nvm == null }}"
    with:
      code: |
        NVM_VERSION="0.40.3"
        curl -o- "https://raw.githubusercontent.com/nvm-sh/nvm/v${NVM_VERSION}/install.sh" | bash
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        echo "NVM $(nvm --version) installed"

  # ── Step 3: Install Git (skipped if already present) ──────────────────────
  - name: install_git
    type: remoteHost.runCommand
    connector-id: ihor-vm
    if: "${{ steps.check_tools.output.git == null }}"
    with:
      code: |
        sudo apt-get update -qq
        sudo apt-get install -y git
        git --version

  # ── Step 4: Install Node.js via NVM LTS (skipped if present) ─────────────
  - name: install_nodejs
    type: remoteHost.runCommand
    connector-id: ihor-vm
    if: "${{ steps.check_tools.output.node == null }}"
    with:
      code: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        if command -v nvm >/dev/null 2>&1; then
          nvm install --lts
          nvm use --lts
          nvm alias default node
        else
          # Fallback: NodeSource if NVM was not installed
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs
        fi
        node --version
        npm --version

  # ── Step 5: Install Yarn via npm (skipped if already present) ───────────────
  - name: install_yarn
    type: remoteHost.runCommand
    connector-id: ihor-vm
    if: "${{ steps.check_tools.output.yarn == null }}"
    with:
      code: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g yarn
        yarn --version

  # ── Step 6: Install Docker via official repo (skipped if present) ─────────
  - name: install_docker
    type: remoteHost.runCommand
    connector-id: ihor-vm
    if: "${{ steps.check_tools.output.docker == null }}"
    with:
      code: |
        #!/bin/bash

        # Exit immediately if a command exits with a non-zero status
        set -e

        echo "=== 1. Cleaning up any incorrect repositories or old packages ==="
        sudo rm -f /etc/apt/sources.list.d/docker.list
        for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do
            sudo apt-get remove -y $pkg || true
        done

        echo "=== 2. Updating package index and installing prerequisites ==="
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl

        echo "=== 3. Setting up Docker's official GPG key ==="
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.gpg
        sudo chmod a+r /etc/apt/keyrings/docker.gpg

        echo "=== 4. Setting up the correct Debian stable repository ==="
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

        echo "=== 5. Updating package index with the fixed repository ==="
        sudo apt-get update

        echo "=== 6. Installing Docker Engine and Plugins ==="
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

        echo "=== 7. Starting and enabling Docker service ==="
        sudo systemctl start docker
        sudo systemctl enable docker

        echo "=== 8. Adding current user to the 'docker' group ==="
        sudo usermod -aG docker $USER

        echo "=== Docker installation completed successfully! ==="
        echo "NOTE: To run docker without sudo in your current terminal session, run: newgrp docker"


  # ── Step 6: Collect final versions of all tools ───────────────────────────
  - name: collect_versions
    type: remoteHost.runCommand
    connector-id: ihor-vm
    with:
      code: |
        _v() { printf '%s' "${1:-not found}"; }
        NVM=$(bash -c 'source "$HOME/.nvm/nvm.sh" 2>/dev/null && nvm --version' 2>/dev/null || true)
        GIT=$(git --version 2>/dev/null || true)
        NODE=$(node --version 2>/dev/null || true)
        NPM=$(npm --version 2>/dev/null || true)
        YARN=$(bash -c 'source "$HOME/.nvm/nvm.sh" 2>/dev/null; yarn --version' 2>/dev/null || true)
        DOCKER=$(docker --version 2>/dev/null || true)
        PYTHON=$(python3 --version 2>/dev/null || true)
        SCRIPT_OUTPUT=$(printf '{"nvm":"%s","git":"%s","node":"%s","npm":"%s","yarn":"%s","docker":"%s","python":"%s"}' \
          "$(_v "$NVM")" "$(_v "$GIT")" "$(_v "$NODE")" \
          "$(_v "$NPM")" "$(_v "$YARN")" "$(_v "$DOCKER")" "$(_v "$PYTHON")")

  # ── Step 7: Print summary ─────────────────────────────────────────────────
  - name: summary
    type: console
    with:
      message: |
        ═══════════════════════════════════════════
          Dev Tools — Installation Complete
        ═══════════════════════════════════════════
          NVM    : {{ steps.collect_versions.output.nvm }}
          Git    : {{ steps.collect_versions.output.git }}
          Node   : {{ steps.collect_versions.output.node }}
          npm    : {{ steps.collect_versions.output.npm }}
          Yarn   : {{ steps.collect_versions.output.yarn }}
          Docker : {{ steps.collect_versions.output.docker }}
          Python : {{ steps.collect_versions.output.python }}
        ───────────────────────────────────────────
          Skipped (already installed):
          {% if steps.check_tools.output.nvm != null %}  • nvm{% endif %}
          {% if steps.check_tools.output.git != null %}  • git{% endif %}
          {% if steps.check_tools.output.node != null %}  • node{% endif %}
          {% if steps.check_tools.output.yarn != null %}  • yarn{% endif %}
          {% if steps.check_tools.output.docker != null %}  • docker{% endif %}
        ═══════════════════════════════════════════
          Note: re-login to apply docker group membership
        ═══════════════════════════════════════════
