version: '1'
name: Install Keep on Remote Host
description: |
  Clean-installs Keep alerting platform on a Debian/Ubuntu remote host using
  the official Docker Compose setup. Uses SQLite for persistence. If Keep is
  already running it is torn down and reinstalled from scratch.
tags:
  - devops
  - setup
  - remote-host
  - keep
  - docker
triggers:
  - type: manual

steps:
  # ── Step 1: Check environment and current Keep state ──────────────────────
  - name: check_environment
    type: remoteHost.runJavascript
    connector-id: my-ssh-connector
    with:
      code: |
        const { execSync } = require('child_process');
        const run = (cmd) => {
          try { return execSync(cmd, { stdio: ['pipe', 'pipe', 'pipe'] }).toString().trim() || null; }
          catch { return null; }
        };
        const keepDir = '/opt/keep';
        return {
          docker:        run('docker --version'),
          dockerCompose: run('docker compose version'),
          keepRunning:   run(`docker ps -q -f name=keep-backend`),
          keepDir,
          host:          run('hostname -I | awk \'{print $1}\''),
        };

  # ── Step 2: Install Docker if missing ────────────────────────────────────
  - name: install_docker
    type: remoteHost.runCommand
    connector-id: my-ssh-connector
    if: "${{ steps.check_environment.output.docker == null }}"
    with:
      code: |
        . /etc/os-release
        sudo apt-get install -y ca-certificates curl gnupg
        sudo install -m 0755 -d /etc/apt/keyrings
        curl -fsSL "https://download.docker.com/linux/${ID}/gpg" \
          | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/${ID} \
          ${VERSION_CODENAME} stable" \
          | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update -qq
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
        sudo usermod -aG docker "$USER"
        docker --version

  # ── Step 3: Tear down existing Keep stack ────────────────────────────────
  - name: teardown
    type: remoteHost.runCommand
    connector-id: my-ssh-connector
    if: "${{ steps.check_environment.output.keepRunning != null }}"
    with:
      code: |
        cd /opt/keep
        docker compose down --remove-orphans 2>/dev/null || true
        echo "Existing Keep stack torn down"

  # ── Step 4: Set up Keep directory and download compose files ─────────────
  - name: setup_dir
    type: remoteHost.runCommand
    connector-id: my-ssh-connector
    with:
      code: |
        sudo mkdir -p /opt/keep/state
        sudo chown -R "$USER:$USER" /opt/keep
        # uid 999 is the user inside the keep-backend container
        chmod -R 0777 /opt/keep/state
        cd /opt/keep
        curl -fsSL https://raw.githubusercontent.com/keephq/keep/main/docker-compose.yml \
          -o docker-compose.yml
        curl -fsSL https://raw.githubusercontent.com/keephq/keep/main/docker-compose.common.yml \
          -o docker-compose.common.yml

        # Override localhost URLs with the real public IP so NEXTAUTH redirects work
        HOST_IP=$(hostname -I | awk '{print $1}')
        {
          echo "services:"
          echo "  keep-frontend:"
          echo "    environment:"
          echo "      - NEXTAUTH_URL=http://${HOST_IP}:3000"
          echo "      - NEXT_PUBLIC_API_URL=http://${HOST_IP}:8080"
        } > /opt/keep/docker-compose.override.yml
        echo "=== Compose files ready (host IP: ${HOST_IP}) ==="
        ls -lh /opt/keep/

  # ── Step 5: Start Keep stack ──────────────────────────────────────────────
  - name: start_keep
    type: remoteHost.runCommand
    connector-id: my-ssh-connector
    with:
      code: |
        cd /opt/keep
        docker compose pull
        docker compose up -d
        echo "Keep stack started"

  # ── Step 6: Wait for backend to be healthy ────────────────────────────────
  - name: wait_for_keep
    type: remoteHost.runCommand
    connector-id: my-ssh-connector
    with:
      code: |
        echo "=== Waiting for Keep API to be ready ==="
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/healthcheck >/dev/null 2>&1; then
            echo "Keep API is ready"
            exit 0
          fi
          echo "Attempt $i/30..."
          sleep 3
        done
        echo "ERROR: Keep API did not become ready in time" >&2
        docker logs keep-backend >&2
        exit 1

  # ── Step 7: Verify running state ──────────────────────────────────────────
  - name: verify_keep
    type: remoteHost.runJavascript
    connector-id: my-ssh-connector
    with:
      code: |
        const { execSync } = require('child_process');
        const run = (cmd) => {
          try { return execSync(cmd, { stdio: ['pipe', 'pipe', 'pipe'] }).toString().trim() || null; }
          catch { return null; }
        };
        return {
          backendStatus:  run('docker inspect -f "{{.State.Status}}" keep-backend 2>/dev/null'),
          frontendStatus: run('docker inspect -f "{{.State.Status}}" keep-frontend 2>/dev/null'),
          wsStatus:       run('docker inspect -f "{{.State.Status}}" keep-websocket-server 2>/dev/null'),
          backendImage:   run('docker inspect -f "{{.Config.Image}}" keep-backend 2>/dev/null'),
          frontendImage:  run('docker inspect -f "{{.Config.Image}}" keep-frontend 2>/dev/null'),
          dbSize:         run('du -sh /opt/keep/state/db.sqlite3 2>/dev/null | cut -f1'),
        };

  # ── Step 8: Summary ───────────────────────────────────────────────────────
  - name: summary
    type: console
    with:
      message: |
        ═══════════════════════════════════════════
          Keep Installation Complete
        ═══════════════════════════════════════════
          UI        : http://{{ steps.check_environment.output.host }}:3000
          API       : http://{{ steps.check_environment.output.host }}:8080
        ───────────────────────────────────────────
          Backend   : {{ steps.verify_keep.output.backendStatus }} ({{ steps.verify_keep.output.backendImage }})
          Frontend  : {{ steps.verify_keep.output.frontendStatus }} ({{ steps.verify_keep.output.frontendImage }})
          WebSocket : {{ steps.verify_keep.output.wsStatus }}
        ───────────────────────────────────────────
          Auth      : None (NO_AUTH mode)
          Database  : SQLite — /opt/keep/state/db.sqlite3 ({{ steps.verify_keep.output.dbSize }})
          Data dir  : /opt/keep/state
          Logs      : docker logs -f keep-backend
          Stop      : cd /opt/keep && docker compose down
          Start     : cd /opt/keep && docker compose up -d
        ═══════════════════════════════════════════
